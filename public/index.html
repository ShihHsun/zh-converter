<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>繁簡轉換</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&family=Noto+Serif+SC:wght@700;900&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-direction="cn-to-tw">
  <!-- 背景裝飾：中國（長城、天壇、祥雲）與台灣（台北 101、玉山、天燈），對調方向時整片鏡像翻轉 -->
  <div class="scene" aria-hidden="true">
    <div class="sun"></div>

    <svg class="deco deco--cn" viewBox="0 0 320 260">
      <!-- 祥雲 -->
      <g class="cloud" fill="none" stroke-width="3" stroke-linecap="round">
        <path d="M40 60 q10-20 28-10 q8-18 26-6 q14-4 14 10 q-12 6-22 0 q-6 10-20 4 q-10 8-26 2z" />
        <path d="M58 52 q6-8 14-2" />
      </g>
      <g class="cloud" fill="none" stroke-width="3" stroke-linecap="round">
        <path d="M200 40 q8-16 22-8 q8-14 22-4 q12-2 12 8 q-10 6-18 0 q-6 8-18 2 q-8 6-20 2z" />
      </g>
      <!-- 天壇：放在最外側，避免被下方的字幕檔卡片擋住 -->
      <g class="silhouette" transform="translate(-108 0)">
        <rect x="128" y="176" width="64" height="8" rx="2" />
        <rect x="134" y="160" width="52" height="16" />
        <path d="M118 162 q42-14 84 0z" />
        <rect x="140" y="138" width="40" height="16" />
        <path d="M126 140 q34-14 68 0z" />
        <rect x="146" y="118" width="28" height="14" />
        <path d="M134 120 q26-14 52 0z" />
        <rect x="158" y="96" width="4" height="12" />
        <circle cx="160" cy="94" r="4" />
      </g>
      <!-- 長城 -->
      <g class="wall">
        <path d="M0 230 q60-50 120-26 t120-4 t80-20 v80 H0z" />
        <!-- 城垛：虛線做出一格一格的垛口，下方實線為女牆 -->
        <path class="wall-top wall-merlons" fill="none" d="M0 225 q60-50 120-26 t120-4 t80-20" />
        <path class="wall-top" fill="none" stroke-width="3" d="M0 230 q60-50 120-26 t120-4 t80-20" />
        <!-- 烽火台 -->
        <g class="tower">
          <rect x="108" y="176" width="30" height="34" />
          <rect x="108" y="168" width="7" height="9" />
          <rect x="119.5" y="168" width="7" height="9" />
          <rect x="131" y="168" width="7" height="9" />
          <path class="tower-door" d="M118 210 v-12 a5 5 0 0 1 10 0 v12z" />
        </g>
        <g class="tower">
          <rect x="230" y="170" width="30" height="34" />
          <rect x="230" y="162" width="7" height="9" />
          <rect x="241.5" y="162" width="7" height="9" />
          <rect x="253" y="162" width="7" height="9" />
          <path class="tower-door" d="M240 204 v-12 a5 5 0 0 1 10 0 v12z" />
        </g>
      </g>
    </svg>

    <svg class="deco deco--tw" viewBox="0 0 320 260">
      <!-- 天燈 -->
      <g class="lantern">
        <path d="M60 40 h22 l4 30 h-30z" />
        <ellipse cx="71" cy="72" rx="6" ry="2" class="flame" />
      </g>
      <g class="lantern lantern--small">
        <path d="M112 76 h14 l3 20 h-20z" />
      </g>
      <g class="lantern lantern--small">
        <path d="M28 98 h12 l2 16 h-16z" />
      </g>
      <!-- 玉山 -->
      <path class="mountain" d="M0 260 L90 140 L120 172 L170 110 L250 210 L320 180 V260z" />
      <path class="snow" d="M150 134 L170 110 L188 132 L176 128 L168 136 L160 128z" />
      <!-- 台北 101 -->
      <g class="silhouette">
        <rect x="248" y="40" width="3" height="26" />
        <path d="M240 66 h19 l-2 8 h-15z" />
        <path d="M236 76 h27 l-4 16 h-19z" />
        <path d="M236 94 h27 l-4 16 h-19z" />
        <path d="M236 112 h27 l-4 16 h-19z" />
        <path d="M236 130 h27 l-4 16 h-19z" />
        <path d="M236 148 h27 l-4 16 h-19z" />
        <path d="M236 166 h27 l-4 16 h-19z" />
        <path d="M236 184 h27 l-4 16 h-19z" />
        <path d="M236 202 h27 l-4 16 h-19z" />
        <rect x="232" y="220" width="35" height="40" />
      </g>
    </svg>

    <!-- 梅花 -->
    <svg class="plum plum--a" viewBox="0 0 40 40">
      <g><circle cx="20" cy="9" r="7" /><circle cx="30.5" cy="16.6" r="7" /><circle cx="26.5" cy="29" r="7" /><circle cx="13.5" cy="29" r="7" /><circle cx="9.5" cy="16.6" r="7" /></g>
      <circle class="plum-core" cx="20" cy="20" r="4" />
    </svg>
    <svg class="plum plum--b" viewBox="0 0 40 40">
      <g><circle cx="20" cy="9" r="7" /><circle cx="30.5" cy="16.6" r="7" /><circle cx="26.5" cy="29" r="7" /><circle cx="13.5" cy="29" r="7" /><circle cx="9.5" cy="16.6" r="7" /></g>
      <circle class="plum-core" cx="20" cy="20" r="4" />
    </svg>
    <svg class="plum plum--c" viewBox="0 0 40 40">
      <g><circle cx="20" cy="9" r="7" /><circle cx="30.5" cy="16.6" r="7" /><circle cx="26.5" cy="29" r="7" /><circle cx="13.5" cy="29" r="7" /><circle cx="9.5" cy="16.6" r="7" /></g>
      <circle class="plum-core" cx="20" cy="20" r="4" />
    </svg>

    <div class="waves"></div>
  </div>

  <main class="container">
    <header class="hero">
      <h1>繁簡轉換</h1>
      <p class="subtitle">一鍵轉換簡體 ⇄ 繁體（台灣用詞）</p>

      <div class="direction-picker">
        <label for="direction">轉換方向</label>
        <select id="direction" name="direction" form="convert-form">
          <!-- 預設選項；頁面載入後會改用 API 回傳的清單 -->
          <option value="cn-to-tw">簡體 → 繁體（台灣用詞）</option>
          <option value="tw-to-cn">繁體 → 簡體</option>
        </select>
      </div>
    </header>

    <form id="convert-form">
      <div class="panes">
        <div class="card card--source">
          <div class="pane-header">
            <span class="badge" data-role="source-badge">简</span>
            <label for="input" data-role="source-name">简体中文</label>
            <span id="input-count" class="count">0 字</span>
          </div>
          <textarea id="input" rows="10" placeholder="请输入要转换的文字…"></textarea>
        </div>

        <div class="bridge">
          <span class="chip" aria-hidden="true">字形</span>
          <button type="button" id="swap-btn" class="swap-btn" aria-label="對調轉換方向" title="對調轉換方向">⇄</button>
          <span class="chip" aria-hidden="true">用詞</span>
          <button type="submit" id="convert-btn" class="convert-btn">轉換</button>
        </div>

        <div class="card card--target">
          <div class="pane-header">
            <span class="badge" data-role="target-badge">繁</span>
            <label for="output" data-role="target-name">繁體中文（台灣）</label>
            <span id="output-count" class="count">0 字</span>
          </div>
          <textarea id="output" rows="10" readonly placeholder="轉換結果會顯示在這裡"></textarea>
          <div class="actions">
            <button type="button" id="copy-btn" class="secondary">複製結果</button>
            <button type="button" id="clear-btn" class="secondary">清除</button>
          </div>
        </div>
      </div>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>

    <!-- 字幕檔轉換：上傳檔案 → POST /api/convert/file → 下載轉換後的檔案 -->
    <section class="card file-section" aria-labelledby="file-title">
      <div class="file-header">
        <h2 id="file-title">字幕檔轉換</h2>
        <p class="hint">支援 .srt、.txt（上限 1MB，可為 UTF-8、Big5 或 GBK 編碼），轉換方向沿用上方設定。</p>
      </div>

      <div class="file-row">
        <div class="file-picker">
          <input type="file" id="file-input" class="visually-hidden" accept=".srt,.txt" />
          <label for="file-input" class="file-btn">選擇檔案</label>
          <span id="file-name" class="file-name">尚未選擇檔案</span>
        </div>

        <div class="actions">
          <button type="button" id="file-convert-btn" disabled>轉換檔案</button>
          <button type="button" id="file-download-btn" class="secondary" disabled>下載結果</button>
        </div>
      </div>

      <p id="file-message" class="message" role="status" aria-live="polite"></p>
      <p id="file-info" class="file-info"></p>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
