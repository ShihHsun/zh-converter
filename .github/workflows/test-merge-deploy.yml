# test 分支更新 → 跑測試 → 合併到 main → 在 main 上再測一次 → 部署到 Cloudflare
#
# 需要先在 GitHub repo 的 Settings → Secrets and variables → Actions 新增：
#   CLOUDFLARE_API_TOKEN   （Cloudflare 的 API Token，權限選「Edit Cloudflare Workers」範本）
#   CLOUDFLARE_ACCOUNT_ID  （Cloudflare 帳號 ID）

name: Test → Merge to main → Deploy

on:
  push:
    branches: [test]
  workflow_dispatch: # 允許在 Actions 頁面手動觸發

# 同一時間只跑一個，避免兩次推送互相搶著合併或部署
concurrency:
  group: test-merge-deploy
  cancel-in-progress: false

jobs:
  # 1. 在 test 分支上跑測試，並確認 Worker 能正常打包
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: 確認 Worker 能打包（不會真的部署）
        run: npx wrangler deploy --dry-run

  # 2. 測試通過後，把 test 合併進 main
  merge-to-main:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要推送到 main 的權限
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # 需要完整歷史才能合併

      - name: 合併 test 到 main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin test
          # 有衝突的話這一步會失敗並停止，不會推送也不會部署
          git merge --no-ff origin/test -m "chore: 🔀 自動合併 test 到 main"
          git push origin main

  # 3. 在合併後的 main 上再測一次，沒問題才部署
  deploy:
    needs: merge-to-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: 部署到 Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
